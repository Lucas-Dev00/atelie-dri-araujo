<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c98270" />
    <title>Ateliê Dri Araújo | Links</title>
    <style>
      :root {
        --terracota: #bd705e;
        --terracota-escuro: #985244;
        --bege: #f8eee4;
        --rosa-seco: #e8b7ae;
        --texto: #653d35;
        --branco: #fffaf6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--texto);
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(
            circle at 10% 8%,
            rgba(232, 183, 174, 0.62) 0 9%,
            transparent 9.5%
          ),
          radial-gradient(
            circle at 92% 91%,
            rgba(189, 112, 94, 0.18) 0 13%,
            transparent 13.5%
          ),
          var(--bege);
      }

      main {
        width: min(100%, 430px);
        text-align: center;
      }

      .profile {
        width: 118px;
        height: 118px;
        display: block;
        object-fit: cover;
        margin: 0 auto 17px;
        border: 5px solid var(--branco);
        border-radius: 50%;
        box-shadow: 0 7px 22px rgba(101, 61, 53, 0.18);
        background: var(--rosa-seco);
      }

      h1 {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .subtitle {
        margin: 8px 0 29px;
        color: var(--terracota-escuro);
        font-family: Arial, sans-serif;
        font-size: 0.84rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .links {
        display: grid;
        gap: 14px;
      }

      .button {
        display: block;
        padding: 18px 20px;
        border: 1px solid rgba(152, 82, 68, 0.13);
        border-radius: 999px;
        color: var(--texto);
        background: rgba(255, 250, 246, 0.84);
        box-shadow: 0 5px 14px rgba(101, 61, 53, 0.1);
        font-family: Arial, sans-serif;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.22s ease,
          background-color 0.22s ease,
          box-shadow 0.22s ease,
          color 0.22s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .button:hover,
      .button:focus-visible,
      .button:active {
        color: var(--branco);
        background: var(--terracota);
        box-shadow: 0 9px 20px rgba(152, 82, 68, 0.25);
        transform: translateY(-3px) scale(1.01);
        outline: none;
      }

      .button:active {
        transform: translateY(0) scale(0.98);
      }

      footer {
        margin-top: 31px;
        color: var(--terracota-escuro);
        font-size: 0.85rem;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="profile"
        alt="Ateliê Dri Araújo"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23e8b7ae'/%3E%3Cpath d='M0 145c39-22 63-14 95 8s69 12 105-13v60H0z' fill='%23bd705e' opacity='.55'/%3E%3Ccircle cx='100' cy='84' r='42' fill='%23f8eee4'/%3E%3Ctext x='100' y='99' text-anchor='middle' font-family='Georgia' font-size='38' fill='%23985244'%3EDRI%3C/text%3E%3C/svg%3E"
      />
      <h1>@ateliedriaraujo</h1>
      <p class="subtitle">Decoração que celebra</p>

      <nav class="links" aria-label="Links principais">
        <a class="button" href="./monte-sua-festa/index.html"
          >✨ Monte sua festa</a
        >

        <a class="button" href="./catalogo/index.html">🎈 Nosso Catálogo</a>
      </nav>

      <footer>Feito para celebrar momentos especiais</footer>
    </main>
  </body>
</html>
